<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laporan — Stock Opname</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/reports.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Lewati ke konten</a>
  <aside class="sidebar">
    <div class="brand">SPPG Pakiskembar 2</div>
    <nav aria-label="Navigasi utama">
      <a href="/dashboard">Dashboard</a>
      <a href="/stock">Stok</a>
      <a href="/transactions">Transaksi</a>
      <a href="/opnames">Stock Opname</a>
      <a href="/reports" aria-current="page">Laporan</a>
      <a href="/masters/products">Barang</a>
      <a href="/imports">Import</a>
    </nav>
  </aside>
  <main id="main">
    <header class="page-header">
      <div>
        <p class="eyebrow">Read-only</p>
        <h1 id="page-title" tabindex="-1">Laporan</h1>
        <p id="page-description">Filter, telusuri, dan ekspor CSV regional.</p>
      </div>
      <button id="export-csv" class="primary" type="button">Ekspor CSV</button>
    </header>
    <section class="panel" aria-labelledby="filter-title">
      <h2 id="filter-title">Filter laporan</h2>
      <form id="filters" class="filters report-filters">
        <div class="field">
          <label for="report-type">Jenis</label>
          <select id="report-type" name="type">
            <option value="STOCK">Stok</option>
            <option value="STOCK_CARD">Kartu stok</option>
            <option value="IN">Barang masuk</option>
            <option value="OUT">Barang keluar</option>
            <option value="ADJUSTMENT">Adjustment</option>
            <option value="OPNAME">Stock opname</option>
            <option value="OPNAME_DIFFERENCE">Selisih opname</option>
            <option value="BATCH_EXPIRY">Batch expiry</option>
          </select>
        </div>
        <div class="field"><label for="filter-from">Dari</label><input id="filter-from" name="from" type="date"></div>
        <div class="field"><label for="filter-to">Sampai</label><input id="filter-to" name="to" type="date"></div>
        <div class="field"><label for="filter-status">Status</label><input id="filter-status" name="status" maxlength="30"></div>
        <button type="submit">Terapkan</button>
      </form>
    </section>
    <p id="screen-status" role="status" aria-live="polite">Memuat data…</p>
    <section id="error-state" class="state error" hidden>
      <h2>Laporan gagal dimuat</h2><p id="error-message"></p>
      <button id="retry-button" type="button">Coba lagi</button>
    </section>
    <section id="empty-state" class="state" hidden><h2>Data tidak ditemukan</h2><p>Ubah filter lalu coba lagi.</p></section>
    <section id="results" class="panel" hidden aria-label="Hasil laporan">
      <div class="table-scroll" tabindex="0" aria-label="Tabel dapat digulir horizontal">
        <table><thead><tr id="report-head"></tr></thead><tbody id="report-body"></tbody></table>
      </div>
      <div class="pagination" aria-label="Paginasi">
        <button id="previous-page" type="button">Sebelumnya</button>
        <span id="page-summary">Halaman 1</span>
        <button id="next-page" type="button">Berikutnya</button>
      </div>
    </section>
  </main>
</body>
</html>
