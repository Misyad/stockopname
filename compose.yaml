services:
  backup-init:
    image: alpine:3.22
    command: ["sh", "-c", "chown 1000:1000 /backup /backup-copy && chmod 0700 /backup /backup-copy"]
    user: "0:0"
    restart: "no"
    read_only: true
    volumes:
      - ${BACKUP_LOCAL_HOST_DIR:-./backups}:/backup
      - ${BACKUP_COPY_HOST_DIR:-./backup-copy}:/backup-copy
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      APP_ORIGIN: ${APP_ORIGIN:-}
      BACKUP_LOCAL_DIR: /var/backups/stock-opname
      BACKUP_COPY_DIR: ${BACKUP_COPY_DIR:-}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      backup-init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - ${BACKUP_LOCAL_HOST_DIR:-./backups}:/var/backups/stock-opname
      - ${BACKUP_COPY_HOST_DIR:-./backup-copy}:/var/backups/stock-opname-copy
      - ${SECRETS_HOST_DIR:-./secrets}:/run/secrets:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
