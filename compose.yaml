services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
      BACKUP_LOCAL_DIR: /var/backups/stock-opname
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      RCLONE_CONFIG_BACKUP_TYPE: ${RCLONE_CONFIG_BACKUP_TYPE:-}
      RCLONE_CONFIG_BACKUP_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      RCLONE_CONFIG_BACKUP_SERVICE_ACCOUNT_FILE: /run/secrets/google-drive.json
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    volumes:
      - backup_local:/var/backups/stock-opname
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/run/secrets/google-drive.json:ro
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  backup_local:
